# Local development backing services only. The server and the frontend run on the host, so hot
# reload and the debugger attach to a normal process; production containerises everything and is
# task 101's problem.
name: vtt

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      # ":?" turns a missing variable into a compose error instead of a container that quietly
      # initialises itself with something nobody chose.
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # Mounted at the path the image declares as its VOLUME, not at the PGDATA subdirectory
      # inside it. Mounting deeper also works, but Docker then creates an anonymous volume for the
      # declared parent, and every `compose down` leaves one behind for good.
      # PGDATA is left at the image default, which on 18 is /var/lib/postgresql/18/docker — the
      # major in the path is deliberate on the image's part: an upgrade cannot silently reuse the
      # old cluster.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # "$$" escapes compose interpolation so the variables are expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
